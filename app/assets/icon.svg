<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NetO11y">
  <rect width="64" height="64" rx="14" fill="#4A4FD4"/>
  <!-- one ring, read as the O of O11y, with three network elements on it -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#FFFFFF" stroke-width="3.6" opacity="0.5"/>
  <g fill="#FFFFFF">
    <circle cx="32" cy="16" r="6"/>
    <circle cx="18" cy="40" r="6"/>
    <circle cx="46" cy="40" r="6"/>
  </g>
  <!-- the live signal at the centre -->
  <circle cx="32" cy="32" r="5.2" fill="#00BB7B"/>
</svg>
