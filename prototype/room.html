  The run so far: fifty rows that were all memory; four hundred dots, legible but a smear; the
  same dots with tails, worse; quartile bars, readable and mute; then a card that led with the
  five subjects nearest a limit over a density curve. That last one was the right answer to the
  wrong complaint — it named five components and left the other four hundred and nine as an
  anonymous silhouette nobody could point at.

  So: every subject gets a cell. Four hundred and fourteen of them, one hexagon each, grouped
  by kind and ordered inside the group, shaded by how much of its own limit it uses. Nothing is
  aggregated away, every cell is hoverable and clickable, and the thing a density curve could
  only imply is now plain — the memory comb has visible bands of identical shade, because
  twenty-four switches report 57.4% to the decimal and thirteen report 81.2%. Those are models,
  not twenty-four findings.

  The toggle switches every cell between what was measured and where Dynatrace says the same
  subject could be at the horizon. Flipping it is the forecast, read in one gesture: the port
  comb barely changes, the processor comb does not change at all, and the memory comb lifts as
  a body.

  One hue, light to dark, because this is a magnitude and not a category. The only cells that
  get a second mark are the ones whose forecast band reaches ninety per cent of their own
  limit — a ring, not a colour, because "near" is a place on the scale and not a verdict the
  app is entitled to render in red.

  Measured on the live environment: 13 days of hourly record, horizon +156 h. Today is the 95th
  percentile of each subject's own hourly series; "could reach" is the peak of the analyzer's

    --ink:#fff; --ink-2:#e2e8f0; --ink-3:#9aa0b4;
    --sel:#ff8643; --cap:#cd0c2c; --fc:#9f81ff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --text:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink-2);font:400 13px/1.5 var(--mono);
       display:flex;align-items:flex-start;min-height:100vh}
  .page{flex:1;min-width:0;padding:24px}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .card-title{font-size:12px;letter-spacing:.02em;color:#95c0ff}
  .card-unit{font-size:12px;color:var(--ink-3);font-family:var(--text)}

  .bar{display:flex;align-items:center;gap:14px;padding:11px 0 9px;border-bottom:1px solid var(--line)}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
  .seg button{background:none;border:0;padding:3px 13px;color:var(--ink-3);font:inherit;
              font-size:11.5px;font-family:var(--text);cursor:pointer}
  .seg button.on{background:rgba(255,255,255,.08);color:var(--ink)}
  .ramp{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3);font-family:var(--text)}
  .ramp i{display:block;width:120px;height:9px;border-radius:2px}
  .near{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--text)}
  .near b{color:var(--ink);font-family:var(--mono);font-weight:400}

  .comb{padding:11px 0 3px;border-top:1px solid var(--line)}
  .comb:first-child{border-top:0}
  .comb-head{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
  .comb-head b{font-size:12px;color:var(--ink);letter-spacing:.02em}
  .comb-head span{font-size:11px;color:var(--ink-3);font-family:var(--text)}
  .comb-head em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink-2);font-family:var(--text)}
  svg{display:block;width:100%;overflow:visible}
  polygon{cursor:pointer}

  .tip{position:fixed;pointer-events:none;z-index:9;background:#19192c;border:1px solid var(--line-2);
       border-radius:6px;padding:6px 9px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;
       box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transition:opacity .08s}
  .tip b{color:var(--ink)} .tip i{font-style:normal;color:var(--ink-3)} .tip u{text-decoration:none;color:var(--fc)}

  .details{width:0;flex:0 0 auto;overflow:hidden;border-left:1px solid var(--line);
           height:100vh;position:sticky;top:0;transition:width .16s ease}
  .details.open{width:520px}
  .det-in{width:520px;height:100%;display:flex;flex-direction:column;padding:18px}
  .det-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px}
  .det-head b{font-size:13px;color:var(--ink)}
  .det-head span{font-size:11px;color:var(--ink-3);font-family:var(--text)}
  .det-x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font:inherit;font-size:16px;line-height:1}
  .det-x:hover{color:var(--ink)}
  .sorts{display:flex;gap:6px;padding:2px 0 8px;border-bottom:1px solid var(--line-2)}
  .sorts button{background:none;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;
                color:var(--ink-3);font:inherit;font-size:11px;font-family:var(--text);cursor:pointer}
  .sorts button.on{color:var(--ink);border-color:var(--ink-3)}
  .det-body{overflow:auto}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{position:sticky;top:0;background:var(--bg);font-weight:400;font-size:11px;color:var(--ink-3);
     text-align:left;padding:6px 8px 5px 0;font-family:var(--text);border-bottom:1px solid var(--line)}
  th.n,td.n{text-align:right}
  td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  tr:hover td{background:rgba(255,255,255,.035);cursor:pointer}
  tr.is-on td{background:rgba(255,255,255,.06);box-shadow:inset 2px 0 0 var(--sel)}
  .nm{color:var(--ink)} .sub{color:var(--ink-3)} .fc{color:var(--fc)} .none{color:var(--ink-3)}
</style>

<div class="page">
  <div class="card">
    <div class="card-head">
      <span class="card-title">Every subject against its own limit</span>
      <span class="card-unit" id="scope"></span>
    </div>

    <div class="bar">
      <div class="seg" id="seg">
        <button type="button" data-v="now" class="on">Measured today</button>
        <button type="button" data-v="reach">Could reach by the horizon</button>
      </div>
      <div class="ramp"><span>0%</span><i id="ramp"></i><span>100% of its own limit</span></div>
      <div class="near" id="near"></div>
    </div>

    <div id="combs"></div>
  </div>
</div>

<div class="details" id="details"><div class="det-in">
  <div class="det-head"><b id="det-t"></b><span id="det-u"></span>
    <button type="button" class="det-x" id="det-x" title="Close">&times;</button></div>
  <div class="sorts">
    <button type="button" data-sort="reach" class="on">Highest it could reach</button>
    <button type="button" data-sort="now">Highest today</button>
    <button type="button" data-sort="move">Rising most</button>
  </div>
  <div class="det-body"><table>
    <colgroup><col><col style="width:17%"><col style="width:58px"><col style="width:76px"><col style="width:70px"><col style="width:58px"></colgroup>
    <thead><tr><th>Subject</th><th id="det-own">Site</th><th class="n">Today</th>
      <th class="n">Could reach</th><th class="n">Expected</th><th class="n">Move</th></tr></thead>
    <tbody id="det-rows"></tbody>
  </table></div>
</div></div>

<div class="tip" id="tip"></div>

<script>
const KINDS = [
  { id: "port", name: "Port traffic", unit: "per cent of its line rate", own: "Device", noun: "uplinks" },
  { id: "cpu",  name: "CPU",          unit: "per cent of the processor", own: "Site",   noun: "processors" },
  { id: "mem",  name: "Memory",       unit: "per cent of all it has",    own: "Site",   noun: "memories" },
];
const NEAR = 90, DEAD = 0.4, R = 9, GAP = 1.6;
const tip = document.getElementById("tip");
let open = null, openAt = -1, sortBy = "reach", view = "now";
const reach = (r) => (r[4] ?? null);
const expect = (r) => (r[3] ?? null);
const move = (r) => (reach(r) == null ? null : Math.round((reach(r) - r[2]) * 10) / 10);
const val = (r) => (view === "reach" ? reach(r) : r[2]);
const med = (a) => { const v = a.slice().sort((x, y) => x - y); return v[Math.floor(v.length / 2)]; };
const r1 = (v) => Math.round(v * 10) / 10;

/**
 * One hue, light to dark, because a per cent of a limit is a magnitude and not a category.
 *
 * Stepped rather than continuous: eight steps let a reader count bands and see that a block of
 * cells is one shade — which is the memory plateaus — where a smooth ramp turns the same block
 * into an indistinguishable wash.
 */
const RAMP = ["#2b3350", "#334271", "#3b5292", "#4465b3", "#507cd2", "#6898e6", "#8ab6f3", "#b4d2ff"];
const shade = (v) => (v == null ? "#1e1e28" : RAMP[Math.min(RAMP.length - 1, Math.floor((v / 100) * RAMP.length))]);

/** pointy-top hexagons, wrapped into rows, odd rows offset by half a cell */
function hexes(n, W) {
  const w = Math.sqrt(3) * R + GAP, h = 1.5 * R + GAP;
  const cols = Math.max(1, Math.floor((W - w / 2) / w));
  return Array.from({ length: n }, (_, i) => {
    const row = Math.floor(i / cols), col = i % cols;
    return { cx: w / 2 + col * w + (row % 2 ? w / 2 : 0), cy: R + row * h };
  }).concat();
}
const hexPath = (cx, cy) => Array.from({ length: 6 }, (_, k) => {
  const a = (Math.PI / 180) * (60 * k - 90);
  return `${(cx + R * Math.cos(a)).toFixed(1)},${(cy + R * Math.sin(a)).toFixed(1)}`;
}).join(" ");

function verdict(rows) {
  const ans = rows.filter((r) => reach(r) != null);
  if (!ans.length) return "not analysed";
  const d = r1(med(ans.map((r) => reach(r))) - med(ans.map((r) => r[2])));
  if (Math.abs(d) < DEAD) return "the fleet stays where it is";
  return `the fleet ${d > 0 ? "moves up" : "eases"} ${Math.abs(d)} points at the median`;
}

function draw() {
  const host = document.getElementById("combs");
  const W = host.clientWidth || 900;
  host.innerHTML = "";
  let total = 0, answered = 0, nearN = 0;
  for (const k of KINDS) {
    /* ordered by what the cells are showing, so a block of one shade is a block of equals and
       the dark end is together rather than scattered through the comb */
    const rows = window.ROOM[k.id].map((r, i) => ({ r, i }))
      .sort((a, b) => (val(b.r) ?? -1) - (val(a.r) ?? -1));
    const pos = hexes(rows.length, W);
    const hh = Math.max(...pos.map((p) => p.cy)) + R + 2;
    const ans = window.ROOM[k.id].filter((r) => reach(r) != null).length;
    const nk = window.ROOM[k.id].filter((r) => reach(r) != null && reach(r) >= NEAR).length;
    total += rows.length; answered += ans; nearN += nk;
    const el = document.createElement("div");
    el.className = "comb";
    el.innerHTML = `
      <div class="comb-head"><b>${k.name}</b>
        <span>${k.unit} · ${rows.length} ${k.noun}${nk ? ` · ${nk} could reach ${NEAR}%` : ""}</span>
        <em>${verdict(window.ROOM[k.id])}</em></div>
      <svg viewBox="0 0 ${W} ${hh}" height="${hh}">
        ${rows.map(({ r, i }, j) => {
          const v = val(r), on = open === k.id && openAt === i;
          const ring = reach(r) != null && reach(r) >= NEAR;
          return `<polygon points="${hexPath(pos[j].cx, pos[j].cy)}" fill="${shade(v)}"
            stroke="${on ? "var(--sel)" : ring ? "#ffffff" : "var(--bg)"}"
            stroke-width="${on ? 2.2 : ring ? 1.6 : 0.8}" data-i="${i}"/>`;
        }).join("")}
      </svg>`;
    el.addEventListener("click", (e) => {
      const t = e.target.closest("[data-i]");
      if (t) show(k.id, Number(t.dataset.i));
    });
    el.addEventListener("mousemove", (e) => {
      const t = e.target.closest("[data-i]");
      if (!t) { tip.style.opacity = 0; return; }
      const r = window.ROOM[k.id][Number(t.dataset.i)];
      tip.innerHTML = `<b>${r[0]}</b> <i>${r[1]}</i><br>${r[2]}% <i>today</i>`
        + (reach(r) == null ? ` · <i>not analysed</i>` : ` · <u>${reach(r)}%</u> <i>could reach</i>`);
      tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 12) + "px";
      tip.style.top = (e.clientY - 48) + "px";
    });
    el.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
    host.appendChild(el);
  }
  document.getElementById("scope").textContent =
    `${total} subjects · ${answered} answered by Dynatrace · 13 days of record · 6½ days ahead`;
  document.getElementById("near").innerHTML =
    `<b>${nearN}</b> could reach ${NEAR}% of their own limit <span style="opacity:.7">(ringed)</span>`;
  document.getElementById("ramp").style.background = `linear-gradient(to right, ${RAMP.join(",")})`;
}

function show(kindId, index) {
  open = kindId; openAt = index;
  const k = KINDS.find((x) => x.id === kindId);
  const rows = window.ROOM[kindId];
  const subject = rows[index];
  const key = { reach: (r) => reach(r) ?? -1, now: (r) => r[2], move: (r) => move(r) ?? -99 }[sortBy];
  const order = rows.map((r, i) => ({ r, i })).sort((a, b) => key(b.r) - key(a.r) || b.r[2] - a.r[2]);
  document.getElementById("det-t").textContent = k.name;
  document.getElementById("det-u").textContent = `${k.unit} · ${rows.length} measured`;
  document.getElementById("det-own").textContent = k.own;
  document.getElementById("det-rows").innerHTML = order.map(({ r, i }) => {
    const m = move(r);
    return `<tr class="${r === subject ? "is-on" : ""}" data-i="${i}">
      <td class="nm">${r[0]}</td><td class="sub">${r[1]}</td>
      <td class="n">${r[2]}%</td>
      <td class="n ${reach(r) == null ? "none" : "fc"}">${reach(r) == null ? "not analysed" : reach(r) + "%"}</td>
      <td class="n ${expect(r) == null ? "none" : "fc"}">${expect(r) == null ? "\u2014" : expect(r) + "%"}</td>
      <td class="n ${m == null || Math.abs(m) < DEAD ? "none" : "fc"}">${m == null ? "\u2014"
        : Math.abs(m) < DEAD ? "flat" : (m > 0 ? "+" : "\u2212") + Math.abs(m)}</td></tr>`;
  }).join("");
  document.getElementById("details").classList.add("open");
  document.getElementById("det-rows").onclick = (e) => {
    const tr = e.target.closest("tr");
    if (tr) show(kindId, Number(tr.dataset.i));
  };
  requestAnimationFrame(() => {
    document.querySelector("#det-rows tr.is-on")?.scrollIntoView({ block: "center" });
    draw();
  });
}

document.querySelectorAll("#seg button").forEach((b) => b.addEventListener("click", () => {
  view = b.dataset.v;
  document.querySelectorAll("#seg button").forEach((x) => x.classList.toggle("on", x === b));
  draw();
}));
document.querySelectorAll(".sorts button").forEach((b) => b.addEventListener("click", () => {
  sortBy = b.dataset.sort;
  document.querySelectorAll(".sorts button").forEach((x) => x.classList.toggle("on", x === b));
  if (open) show(open, openAt);
}));
document.getElementById("det-x").addEventListener("click", () => {
  open = null; openAt = -1;
  document.getElementById("details").classList.remove("open");
  draw();
});
addEventListener("resize", draw);
draw();
</script>
