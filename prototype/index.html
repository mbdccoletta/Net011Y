<meta charset="utf-8">
<title>NetworkPlane · prototype (legacy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F3F8; --surface:#FFFFFF; --surface-2:#ECECF4; --line:#DADBE6; --ink:#1D1E33; --muted:#5D5F78;
  --primary:#4A4FD4; --primary-soft:#E5E6FB;
  --crit:#C22A43; --crit-fill:#FBE2E7; --warn:#A96400; --warn-fill:#FCEFD7; --good:#1C8454; --good-fill:#DCF2E6; --nm:#72748C; --nm-fill:#E9E9F1;
  --wire:#B9BBD3; --scrim:rgba(20,21,40,.35);
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131421; --surface:#1B1C2D; --surface-2:#23243A; --line:#32344C; --ink:#E6E7F3; --muted:#9A9CB7;
  --primary:#9296FF; --primary-soft:#2A2C56;
  --crit:#FF6E83; --crit-fill:#3D1B26; --warn:#F0B04A; --warn-fill:#392B12; --good:#52CB8C; --good-fill:#163224; --nm:#9A9CB7; --nm-fill:#29293D; --wire:#46486A; --scrim:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#131421; --surface:#1B1C2D; --surface-2:#23243A; --line:#32344C; --ink:#E6E7F3; --muted:#9A9CB7;
  --primary:#9296FF; --primary-soft:#2A2C56;
  --crit:#FF6E83; --crit-fill:#3D1B26; --warn:#F0B04A; --warn-fill:#392B12; --good:#52CB8C; --good-fill:#163224; --nm:#9A9CB7; --nm-fill:#29293D; --wire:#46486A; --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0;padding-inline:16px;padding-block:0 48px}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
svg text{fill:var(--muted);font-family:var(--sans)}

/* shell */
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:12px;max-width:1480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.srcchip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted)}
.srcchip.sim{border-color:var(--warn);background:var(--warn-fill);color:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:15px;padding:0 8px}
.iconbtn:hover{border-color:var(--primary)}
.app{display:grid;grid-template-columns:1fr;gap:16px;max-width:1480px;margin:0 auto;align-items:start}
@media (min-width:1040px){.app{grid-template-columns:310px minmax(0,1fr)}}
.app.full{grid-template-columns:minmax(0,1fr)}
main,.stack,.stack>*{min-width:0}
.stack{display:grid;gap:14px}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin:0;font-size:15px;font-weight:700}
.panel-b{padding:12px 16px 16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.Critical{background:var(--crit-fill);color:var(--crit)} .pill.Warning{background:var(--warn-fill);color:var(--warn)}
.pill.Healthy{background:var(--good-fill);color:var(--good)} .pill.NM{background:var(--nm-fill);color:var(--nm)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.Critical{background:var(--crit);color:var(--crit)} .dot.Warning{background:var(--warn);color:var(--warn)} .dot.Healthy{background:var(--good);color:var(--good)} .dot.NM{background:var(--nm)}
@media (prefers-reduced-motion: no-preference){
  .breath.Critical{animation:breath 1.7s ease-in-out infinite} .breath.Warning{animation:breath 3.2s ease-in-out infinite} .breath.Healthy{animation:breath 6s ease-in-out infinite}
}
@keyframes breath{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,currentColor 22%,transparent)}}
.chip{font-size:12px;background:var(--surface-2);border-radius:4px;padding:2px 8px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;border:0}
.chip b{color:var(--ink);font-weight:600}
.chip.tag{background:var(--primary-soft);color:var(--primary)}
.chip.inc{background:var(--crit-fill);color:var(--crit);font-family:var(--mono);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
.empty{padding:14px 8px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-weight:600;text-align:left}
.linkbtn:hover{color:var(--primary);text-decoration:underline}
.bar{height:8px;border-radius:2px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.note-box{background:var(--primary-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13px}

/* sidebar */
.side{display:grid;gap:10px;padding:12px}
@media (min-width:1040px){.side{position:sticky;top:8px;height:calc(100vh - 16px);grid-template-rows:auto auto auto minmax(0,1fr)}}
.siterow{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 8px;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:1px 8px;cursor:pointer;align-items:center}
.siterow:hover{background:var(--surface-2)}
.siterow[aria-current="true"]{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}
.siterow .nm{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.siterow .cd{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.siterow .cause{grid-column:2/4;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.netrow{border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;padding-block:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.fbtn[aria-pressed="true"]{border-color:var(--primary);color:var(--ink);background:var(--primary-soft)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.sitelist{list-style:none;margin:0;padding:0;overflow:auto;display:grid;align-content:start;max-height:340px}
@media (min-width:1040px){.sitelist{max-height:none}}
.sitelist .group{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 8px 4px}

/* page head */
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--primary);font-weight:600}
.titlerow{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.lede{margin:0;font-size:14.5px;max-width:90ch}
.cause-box{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tone,var(--line));border-radius:10px;padding:12px 16px}
.cause-box.Critical{--tone:var(--crit)} .cause-box.Warning{--tone:var(--warn)} .cause-box.Healthy{--tone:var(--good)}
.cause-box .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--tone)}
.cause-box .t{font-size:15px;font-weight:600}
.cause-box .go{margin-left:auto;color:var(--primary)}

/* info cards */
.infocards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1100px){.infocards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.info{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;gap:3px;align-content:start}
.info::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tone,var(--line))}
.info.Critical{--tone:var(--crit)} .info.Warning{--tone:var(--warn)} .info.Healthy{--tone:var(--good)} .info.NM{--tone:var(--nm)}
.info .lab{font-size:12px;font-weight:600;color:var(--muted)}
.info .val{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--tone,var(--ink))}
.info .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.info .ctx{font-size:12px;color:var(--muted)}

/* site tabs */
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.stab{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.stab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.stab:hover{color:var(--ink)}

/* network page */
.netgrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:1240px){.netgrid{grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr)}}
.netgrid > :only-child{grid-column:1/-1}
.brmap{width:100%;height:auto;max-height:560px;display:block;margin:0 auto}
.brmap g[data-site]{cursor:pointer}
.causes{list-style:none;margin:0;padding:0;display:grid}
.causes li{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.causes li:first-child{border-top:0;padding-top:0}
.causes .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.causes .row b{font-size:14px}
.sitechip{cursor:pointer}
.sitechip:hover{color:var(--ink);background:var(--primary-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tile{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tone);border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.tile.Critical{--tone:var(--crit)} .tile.Warning{--tone:var(--warn)} .tile.Healthy{--tone:var(--good)}
.tile:hover{border-color:var(--primary)}

/* network-wide view */
.netgraph svg{display:block;width:100%;height:auto;min-width:920px}
.lnode{cursor:pointer}
.pscroll{max-height:600px;overflow:auto;padding-top:0}
.paths{display:grid}
.prow{display:grid;grid-template-columns:minmax(120px,160px) repeat(var(--n),minmax(40px,1fr)) minmax(140px,1.5fr);align-items:center;column-gap:4px;padding:4px 6px;border:0;border-radius:6px;background:none;width:100%;text-align:left;cursor:pointer}
.prow:hover{background:var(--surface-2)}
.prow.head{cursor:default;position:sticky;top:0;z-index:1;background:var(--surface);padding-block:10px 6px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prow.head:hover{background:var(--surface)}
.pcell-h{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;overflow:hidden;white-space:nowrap}
.pcause{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:8px}
.pcell{position:relative;height:20px;display:grid;place-items:center}
.pcell::before{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:2px solid var(--line)}
.pcell.first::before{left:50%} .pcell.last::before{right:50%}
.pnode{position:relative;width:10px;height:10px;border-radius:50%}
.pnode.cause{width:15px;height:15px;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 28%,transparent)}
.pnode.cons{width:12px;height:12px;background:var(--surface);border:2px solid currentColor}
.pnode.none{width:8px;height:2px;border-radius:1px;background:var(--wire)}

/* e2e graph */
.enode{cursor:pointer}
.e2egraph .mono{font-family:var(--mono)}

/* device detail */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 14px;display:grid;gap:4px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .note{font-size:12px;color:var(--muted)}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reasons li{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.events{list-style:none;margin:0;padding:0;display:grid}
.events li{padding:8px 2px;border-top:1px solid var(--line);display:grid;gap:2px;font-size:12.5px}
.events li:first-child{border-top:0}
.events .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.events .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
.events .mn{font-family:var(--mono);font-size:11px;font-weight:500}
.lvl{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:3px}
.lvl.ERROR{background:var(--crit-fill);color:var(--crit)} .lvl.WARN{background:var(--warn-fill);color:var(--warn)} .lvl.INFO,.lvl.TRAP{background:var(--surface-2);color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:6px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qbar{display:grid;grid-template-columns:170px 1fr 48px;gap:8px;align-items:center;font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:21;overflow-x:hidden;overflow-y:auto;padding:0 18px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;box-shadow:-16px 0 40px rgba(0,0,0,.2)}
.drawer > *, .drawer .stack > *, .drawer .panel{min-width:0}
.drawer-h{display:flex;gap:10px;align-items:center;position:sticky;top:0;background:var(--bg);padding-block:14px 10px;z-index:1;border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-h .kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
</style>

<script>
/* ---------- data ---------- */
const SOURCES = { real: window.NET, demo: window.NET_DEMO };
let N, byName;
const state = { src: "demo", site: null, tab: "path", filter: "all", q: "", layerFilter: null, drawer: [], onlyIssues: true, showAllIf: false };
function useSource(src) {
  state.src = SOURCES[src] ? src : "real";
  N = SOURCES[state.src];
  byName = Object.fromEntries(N.devices.map(d => [d.name, d]));
  Object.assign(state, { site: null, tab: "path", filter: "all", q: "", layerFilter: null, showAllIf: false });
}

/* ---------- formatting & verdict primitives ---------- */
const ORDERV = {Critical: 0, Warning: 1, Healthy: 2, "Not monitored": 3};
const DUR = {Critical: "1.7s", Warning: "3.2s", Healthy: "6s"};
const ROLE_LABEL = {core:"Core", edge:"Roteador de borda", firewall:"Firewall", lb:"Load balancer", switch:"Switch", compute:"Compute", wlc:"Controladora Wi-Fi", ap:"Access point", endpoint:"Endpoint", other:"Outro"};
const ROLE_LAYER = {core:"Core", edge:"Borda", firewall:"Segurança", lb:"Segurança", switch:"Acesso", compute:"Acesso", wlc:"Acesso", ap:"Acesso", endpoint:"Acesso", other:"Acesso"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vk = v => v === "Not monitored" ? "NM" : v;
const pill = v => `<span class="pill ${vk(v)}">${v === "Not monitored" ? "Sem polling" : v}</span>`;
const dot = (v, breath) => `<span class="dot ${vk(v)} ${breath ? "breath" : ""}" aria-hidden="true"></span>`;
const worst = list => list.includes("Critical") ? "Critical" : list.includes("Warning") ? "Warning" : list.includes("Healthy") ? "Healthy" : "Not monitored";
const toneVar = v => ({Critical:"var(--crit)", Warning:"var(--warn)", Healthy:"var(--good)"}[v] || "var(--nm)");
const fmtN = n => n == null ? "—" : Number(n).toLocaleString("pt-BR");
const numPt = v => v == null || v === "—" ? "—" : typeof v === "number" ? v.toLocaleString("pt-BR", {maximumFractionDigits: 3}) : esc(v);
const fmtBps = b => { if (b == null) return "—"; const u = ["bps","kbps","Mbps","Gbps","Tbps"]; let i = 0; while (b >= 1000 && i < u.length-1) { b /= 1000; i++; } return `${b >= 100 ? b.toFixed(0) : b.toFixed(1)} ${u[i]}`; };
const fmtBytes = b => { if (b == null) return "—"; const u = ["B","KB","MB","GB","TB"]; let i = 0; while (b >= 1024 && i < u.length-1) { b /= 1024; i++; } return `${b >= 100 ? b.toFixed(0) : b.toFixed(1)} ${u[i]}`; };
const speedLabel = s => !s ? "—" : s >= 1000 ? `${+(s/1000).toFixed(1)} Gbps` : `${s} Mbps`;
const stripDevice = t => (t || "").replace(/^[A-Z0-9][A-Za-z0-9-]+: /, "");
const siteName = c => N.sites[c]?.name || c;
function infoCard(label, value, unit, ctx, tone) {
  return `<div class="info ${tone ? vk(tone) : ""}"><span class="lab">${label}</span><span class="val">${value}${unit ? `<small>${unit}</small>` : ""}</span>${ctx ? `<span class="ctx">${ctx}</span>` : ""}</div>`;
}
function spark(arr, w = 120, h = 28, color = "var(--primary)", arr2 = null, color2 = "var(--muted)") {
  if (!arr || arr.length < 2) return `<svg width="${w}" height="${h}" aria-hidden="true"></svg>`;
  const all = arr.concat(arr2 || []), max = Math.max(...all, 1), min = Math.min(...all, 0);
  const x = i => 1 + i * (w-4) / (arr.length-1), y = v => h-3 - (v-min) / ((max-min) || 1) * (h-7);
  const line = a => a.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${line(arr)}L${x(arr.length-1).toFixed(1)},${h-1}L1,${h-1}Z" fill="${color}" opacity=".12"/>
    ${arr2 && arr2.length > 1 ? `<path d="${line(arr2)}" fill="none" stroke="${color2}" stroke-width="1.2" stroke-dasharray="3 2"/>` : ""}
    <path d="${line(arr)}" fill="none" stroke="${color}" stroke-width="1.6"/>
    <circle cx="${x(arr.length-1).toFixed(1)}" cy="${y(arr[arr.length-1]).toFixed(1)}" r="2.6" fill="${color}"/></svg>`;
}

/* ---------- model: one place that answers "how is this site and why" ---------- */
function siteV(code) {
  return (N.siteVerdicts && N.siteVerdicts[code]) || worst(N.devices.filter(d => d.site === code && d.verdict !== "Not monitored").map(d => d.verdict));
}
function pathOf(code) {
  return N.e2e.paths.find(p => p.site === code) || N.e2e.paths.find(p => p.hops[0]?.site === code) || null;
}
// a path belongs to a site when it was generated for it, or (real data) when it starts there
const ownsPath = (p, code) => !!p && (p.site === code || (!p.site && p.hops[0]?.site === code));
function siteInfo(code) {
  const s = N.sites[code], v = siteV(code), p = pathOf(code);
  const devs = N.devices.filter(d => d.site === code);

  return `<section class="panel"><div class="panel-h"><h2>Onde o tempo de resposta é gasto</h2><span class="hint">p90 de ${esc(app.title)} a partir do site · estimativa pela latência de cada trecho</span></div>
    <div class="panel-b stack">
      <div style="display:flex;height:28px;border-radius:6px;overflow:hidden;background:var(--surface-2)" role="img" aria-label="Rede ${pct(net)}%, aplicação ${pct(total - net)}%">
        ${parts.map(p => `<div title="${esc(p[0])}: ${numPt(Math.round(p[1] * 10) / 10)} ms" style="width:${Math.max(p[1] / total * 100, .8)}%;background:${p[2]}"></div>`).join("")}</div>
      <div class="legend">${parts.map(p => `<span><i style="border-top:10px solid ${p[2]};width:12px"></i>${esc(p[0])} <b class="mono" style="color:var(--ink)">${p[1] < 10 ? numPt(Math.round(p[1] * 10) / 10) : fmtN(Math.round(p[1]))} ms</b> <span class="mono">(${pct(p[1])}%)</span></span>`).join("")}</div>
      <p style="margin:0;font-size:14px">A rede responde por <b>${pct(net)}%</b> dos ${numPt(Math.round(total / 100) / 10)} s de p90; o restante é tempo da aplicação.${lossy ? ` O link tem <b>${numPt(active.lossPct)}% de perda</b>: retransmissões TCP alongam as transações e não aparecem na latência, então a rede pesa mais do que esta divisão sugere.` : ""}</p>
    </div></section>`;
}

/* ---------- drawer contents ---------- */
function hopDetail(h) {
  if (h.kind === "circuit") return `<section class="panel"><div class="panel-b tblwrap">${circuitsTable(h.circuits)}</div></section>`;
  if (h.kind === "app") return `<section class="panel"><div class="panel-b tblwrap"><table style="min-width:600px"><thead><tr><th>Transação</th><th class="r">p90</th><th class="r">Erros</th><th class="r">Execuções · 1h</th><th>p90 · 24h</th></tr></thead><tbody>
    ${h.app.transactions.map(t => `<tr><td style="font-weight:600">${esc(t.name)}</td><td class="r mono">${t.p90Ms != null ? fmtN(t.p90Ms) + " ms" : "—"}</td>
      <td class="r mono">${t.errPct != null ? numPt(t.errPct) + "%" : "—"}</td><td class="r mono">${fmtN(t.count)}</td><td>${spark(t.p90Ts, 140, 24, toneVar(h.verdict))}</td></tr>`).join("")}</tbody></table>
    <div class="hint" style="margin-top:8px">Medido pelo OneAgent no servidor da aplicação, filtrado pela sub-rede do site.${h.app.consequenceOf ? ` Sem sessões porque ${esc(h.app.consequenceOf)} está fora.` : ""}</div></div></section>`;
  if (h.kind === "internet") return `<section class="panel"><div class="panel-b tblwrap"><table><thead><tr><th>Peer</th><th>AS remoto</th><th>Estado</th><th>Equipamento local</th></tr></thead><tbody>
    ${h.peers.map(p => `<tr><td class="mono">${esc(p.peer)}</td><td class="mono">${esc(p.remoteAs)}</td><td>${pill((p.state || "").startsWith("established") ? "Healthy" : "Critical")} <span class="mono hint">${esc(p.state)}</span></td><td><button class="linkbtn" data-dev="${esc(p.device)}">${esc(p.device)}</button></td></tr>`).join("")}</tbody></table></div></section>`;
  if (h.kind === "cloud") {
    const suspect = r => (r.retr || 0) > 0 || (r.resets || 0) > 0;
    return `<section class="panel"><div class="panel-h"><h3>Clusters</h3></div><div class="panel-b tblwrap"><table style="min-width:600px"><thead><tr><th>Cluster / grupo</th><th>Nuvem</th><th class="r">Conversas</th><th class="r">Hosts</th><th class="r">Volume</th><th class="r">Retransmissão</th></tr></thead><tbody>
      ${h.clusters.map(c => `<tr><td style="font-weight:600">${esc(c.name)}</td><td>${esc(c.cloud || "—")}</td><td class="r mono">${fmtN(c.conv)}</td><td class="r mono">${fmtN(c.hosts)}</td><td class="r mono">${fmtBytes(c.bytes)}</td><td class="r mono">${c.retrPct != null ? numPt(c.retrPct) + "%" : "—"}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="panel"><div class="panel-h"><h3>Maiores conversas · é a rede ou a aplicação?</h3><span class="hint">flows do OneAgent</span></div><div class="panel-b tblwrap"><table style="min-width:640px"><thead><tr><th>Rede</th><th>Host</th><th>Destino</th><th class="r">Volume</th><th class="r">Retrans.</th><th class="r">Resets</th></tr></thead><tbody>
      ${N.oneagent.slice(0, 20).map(r => `<tr><td>${suspect(r) ? `<span class="pill Warning">Suspeita</span>` : `<span class="pill Healthy">Isenta</span>`}</td><td class="mono" style="font-size:12px">${esc(r.host)}</td><td class="mono">${esc(r.dst)}:${esc(r.dport)}</td><td class="r mono">${fmtBytes(r.bytes)}</td><td class="r mono">${fmtN(r.retr)}</td><td class="r mono">${fmtN(r.resets)}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  return devicesTable(h.devices.map(n => byName[n]));
}
function timeline(d) {
  const w = 700, h = 150, pad = 40, hours = 24, x = i => pad + i * (w - pad - 10) / hours;
  const max = Math.max(...d.syslogErrTs, 1), bw = ((w - pad - 10) / hours - 2).toFixed(1);
  const bars = d.syslogErrTs.map((v, i) => `<rect x="${(x(i)+1).toFixed(1)}" y="${(96 - v / max * 70).toFixed(1)}" width="${bw}" height="${(v / max * 70).toFixed(1)}" fill="var(--crit)" opacity=".55"><title>${v} syslog ERROR</title></rect>`).join("");
  const av = (d.availTs || []).map((v, i) => `<rect x="${(x(i)+1).toFixed(1)}" y="112" width="${bw}" height="10" fill="${v ? "var(--good)" : "var(--crit)"}"/>`).join("");
  const end = new Date(N.meta.generatedAt.replace("Z", ":00Z")).getTime();
  const traps = N.traps.filter(t => t.device === d.name).map(t => { const hAgo = (end - new Date(t.t).getTime()) / 3.6e6; if (hAgo < 0 || hAgo > 24) return "";
    const xx = x(hours - hAgo).toFixed(1); return `<line x1="${xx}" x2="${xx}" y1="128" y2="138" stroke="var(--primary)" stroke-width="2"><title>${esc(t.oid)} ${esc(t.t)}</title></line>`; }).join("");
  const ticks = [0, 6, 12, 18, 24].map(i => `<text x="${x(i)}" y="${h-2}" font-size="10" text-anchor="middle">${i === 24 ? "agora" : `-${24-i}h`}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Linha do tempo de 24 horas">
    <line x1="${pad}" x2="${w-10}" y1="96" y2="96" stroke="var(--line)"/>
    <text x="0" y="34" font-size="10">syslog</text><text x="0" y="46" font-size="10">ERROR/h</text><text x="${pad-4}" y="30" font-size="10" text-anchor="end">${max}</text>
    ${bars}<text x="0" y="121" font-size="10">SNMP</text>${av || `<text x="${pad}" y="121" font-size="10">sem polling</text>`}
    <text x="0" y="137" font-size="10">traps</text>${traps}${ticks}</svg>`;
}
function deviceDetail(d) {
  const nm = d.verdict === "Not monitored";
  const up = d.interfaces.filter(i => i.oper.startsWith("up")).length;
  const downAdminUp = d.interfaces.filter(i => i.oper.startsWith("down") && i.admin.startsWith("up")).length;
  const neigh = [...N.links.filter(l => l.a === d.name || l.b === d.name).map(l => ({proto: "LLDP", peer: l.a === d.name ? l.b : l.a, st: l.label})),
                 ...N.peers.filter(p => p.device === d.name).map(p => ({proto: p.proto, peer: p.peer + (p.remoteAs ? ` · AS ${p.remoteAs}` : ""), st: p.state}))];
  const problem = i => i.flag || i.errors || i.crc || (i.uplink && i.oper.startsWith("down") && i.admin.startsWith("up"));
  let ifs = d.interfaces.slice().sort((a, b) => (b.util ?? -1) - (a.util ?? -1));
  if (state.onlyIssues) ifs = ifs.filter(problem);
  const shown = state.showAllIf ? ifs : ifs.slice(0, 30);
  const flagTxt = {inconsistent: "acima da velocidade", saturated: "saturada", high: "alta"};
  const utilColor = i => i.flag === "saturated" ? "var(--crit)" : i.flag ? "var(--warn)" : "var(--primary)";
  const T = N.meta.thresholds;
  return `<div class="stack">
    <div class="chips">${pill(d.verdict)}<span class="chip">site <b>${esc(siteName(d.site))}</b></span><span class="chip">papel <b>${ROLE_LABEL[d.role] || d.role}</b></span><span class="chip">IP <b class="mono">${esc(d.ip)}</b></span>${d.incident ? `<span class="chip inc">${esc(d.incident)}</span>` : ""}</div>
    <div class="hint">${esc(d.desc)}</div>
    <section class="panel"><div class="panel-h"><h3>Por que ${d.verdict === "Not monitored" ? "sem polling" : d.verdict}</h3></div>
      <div class="panel-b">${d.reasons.length ? `<ul class="reasons">${d.reasons.map(r => `<li>${pill(r.level)}<span>${esc(r.text)}</span></li>`).join("")}</ul>` : `<div class="empty">${dot("Healthy")} Nenhuma regra violada.</div>`}</div></section>
    ${nm ? `<div class="note-box">O autodiscovery encontrou este equipamento, mas nenhuma extensão coleta métricas dele. Ação sugerida: ativar a extensão ${esc(d.vendor)} para o IP ${esc(d.ip)}.</div>` : `
    <div class="kpis">
      <div class="panel kpi"><span class="lab">Disponibilidade · 24h</span><span class="val" style="color:${d.availPct >= T.avail_crit ? "var(--good)" : "var(--crit)"}">${numPt(d.availPct)}<small>%</small></span></div>
      <div class="panel kpi"><span class="lab">CPU agora</span><span class="val" style="color:${d.cpuNow >= T.cpu_crit ? "var(--crit)" : d.cpuNow >= T.cpu_warn ? "var(--warn)" : "var(--ink)"}">${d.cpuNow != null ? Math.round(d.cpuNow) : "—"}<small>${d.cpuNow != null ? "%" : ""}</small></span>${d.cpu.length ? spark(d.cpu, 130, 22, d.cpuNow >= T.cpu_crit ? "var(--crit)" : "var(--primary)") : ""}</div>
      <div class="panel kpi"><span class="lab">ICMP</span><span class="val">${d.icmp?.rttMs != null ? numPt(d.icmp.rttMs) : "—"}<small>${d.icmp?.rttMs != null ? " ms" : ""}</small></span><span class="note">perda ${d.icmp?.loss != null ? numPt(d.icmp.loss) + "%" : "—"}</span></div>
      <div class="panel kpi"><span class="lab">Interfaces up</span><span class="val">${up}<small>/ ${d.interfaces.length}</small></span><span class="note">${downAdminUp} down com admin up</span></div>
    </div>`}
    <section class="panel"><div class="panel-h"><h3>Linha do tempo · 24h</h3><span class="hint">syslog, disponibilidade e traps</span></div><div class="panel-b">${timeline(d)}</div></section>
    ${nm ? "" : `<section class="panel"><div class="panel-h"><h3>Interfaces <span class="hint" style="font-weight:400">${ifs.length} de ${d.interfaces.length}</span></h3>
      <div class="seg" role="group" aria-label="Filtro de interfaces"><button data-act="onlyIssues" aria-pressed="${state.onlyIssues}">Com problema</button><button data-act="onlyIssues" aria-pressed="${!state.onlyIssues}">Todas</button></div></div>
      <div class="panel-b tblwrap"><table style="min-width:620px"><thead><tr><th>Interface</th><th>Oper / Admin</th><th class="r">Velocidade</th><th>Utilização máx</th><th>In / out</th><th class="r">Erros</th></tr></thead><tbody>
      ${shown.map(i => `<tr><td class="mono">${esc(i.name)}${i.uplink ? ` <span class="chip">uplink</span>` : ""}</td>
        <td class="mono" style="font-size:11.5px">${esc(i.oper)} / ${esc(i.admin)}</td><td class="r mono">${speedLabel(i.speed)}</td>
        <td>${i.util == null ? "—" : `<div style="display:flex;gap:8px;align-items:center"><div class="bar" style="width:70px"><i style="width:${Math.min(100, i.util)}%;background:${utilColor(i)}"></i></div><span class="mono">${i.util}%</span>${i.flag ? `<span class="hint" style="color:${utilColor(i)}">${flagTxt[i.flag]}</span>` : ""}</div>`}</td>
        <td>${i.in.length ? spark(i.in, 100, 20, "var(--primary)", i.out) : "—"}</td><td class="r mono">${fmtN(i.errors + i.crc)}</td></tr>`).join("") || `<tr><td colspan="6"><div class="empty">${dot("Healthy")} Nenhuma interface com problema.</div></td></tr>`}
      </tbody></table>${ifs.length > 30 ? `<button class="linkbtn" data-act="allIf" style="margin-top:10px;color:var(--primary)">${state.showAllIf ? "Mostrar menos" : `Mostrar todas as ${ifs.length}`}</button>` : ""}</div></section>`}
    <section class="panel"><div class="panel-h"><h3>Eventos recentes</h3></div><div class="panel-b">${d.events.length ? `<ul class="events">${d.events.slice(0, 20).map(e => eventLine(e)).join("")}</ul>` : `<div class="empty">Sem eventos no período.</div>`}</div></section>
    ${neigh.length ? `<section class="panel"><div class="panel-h"><h3>Vizinhos e roteamento</h3></div><div class="panel-b"><table><tbody>${neigh.map(n => `<tr><td class="mono">${n.proto}</td><td>${byName[n.peer] ? `<button class="linkbtn" data-dev="${esc(n.peer)}">${esc(n.peer)}</button>` : esc(n.peer)}</td><td class="mono" style="font-size:11.5px">${esc(n.st)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
  </div>`;
}
function settings() {
  const rx = /^([A-Z]{2})-([A-Z]{2})-([A-Z0-9]{3,5})-([A-Z]+)(\d*)$/;
  const real = SOURCES.real, demo = SOURCES.demo;
  const sources = !N.demo ? `<section class="panel"><div class="panel-h"><h3>Saúde das fontes no GRU</h3></div><div class="panel-b tblwrap"><table><tbody>
    ${[["Syslog", "Healthy", "IP de origem casa com o equipamento SNMP"], ["SNMP polling", "Healthy", `${N.devices.filter(d => d.mode === "Extension").length} equipamentos com extensão, ${N.devices.filter(d => d.mode !== "Extension").length} só descobertos`],
       ["SNMP traps", "Warning", "volume baixo, ifIndex 0"], ["NetFlow", "Warning", "dado de simulador, sem ifIndex"], ["Flow OneAgent", "Healthy", "processo, cluster e cost center"], ["Primary tags", "Critical", "nenhum dado de rede com tag"]]
      .map(([n, v, t]) => `<tr><td style="font-weight:600">${n}</td><td>${pill(v)}</td><td>${t}</td></tr>`).join("")}</tbody></table></div></section>` : "";
  return `<div class="stack">
    <section class="panel"><div class="panel-h"><h3>Fonte de dados</h3></div><div class="panel-b stack">
      <div class="seg" role="group" aria-label="Fonte de dados">
        ${demo ? `<button data-src="demo" aria-pressed="${state.src === "demo"}">Exemplo Brasil · simulado</button>` : ""}
        <button data-src="real" aria-pressed="${state.src === "real"}">GRU · dados reais</button></div>
      <p class="hint" style="margin:0">${N.demo
        ? `${Object.values(N.sites).filter(s => !s.dc).length} filiais fictícias e um data center, nomes na convenção BR-UF-SITE-PAPEL. Nenhum número vem de cliente real; as regras de veredito são as mesmas dos dados reais.`
        : `Tenant ${esc(real.meta.tenant)}, laboratório com ${Object.keys(real.sites).length} sites, dados capturados em ${esc(real.meta.generatedAt.replace("T", " "))}.`}</p></div></section>
    ${sources}
    <section class="panel"><div class="panel-h"><h3>Tags de site e papel</h3><span class="hint">derivadas do nome do equipamento</span></div><div class="panel-b stack">
      <div class="note-box">Regra no OpenPipeline sobre <span class="mono">sys.name</span>: <span class="mono">parse "LD:country '-' LD:state '-' LD:site.code '-' ALPHA:role.code"</span> + lookup de sites para <span class="mono">site.id</span> e nome.</div>
      <div class="tblwrap"><table style="min-width:560px"><thead><tr><th>sys.name</th><th>site</th><th>papel</th><th>Modo</th></tr></thead><tbody>
      ${N.tagPreview.slice(0, 60).map(t => { const m = t.name.match(rx); return `<tr><td class="mono">${esc(t.name)}</td><td><span class="chip tag">${esc(m ? m[3] : t.site)}</span></td><td><span class="chip tag">${esc(t.role)}</span></td><td class="mono">${esc(t.mode)}</td></tr>`; }).join("")}
      </tbody></table></div></div></section>
  </div>`;
}
function drawer() {
  const top = state.drawer[state.drawer.length - 1];
  if (!top) return "";
  let kind = "", title = "", body = "";
  if (top.type === "device") { const d = byName[top.name]; kind = "Equipamento"; title = d.name; body = deviceDetail(d); }
  else if (top.type === "hop") {
    const P = N.e2e.paths.find(x => x.id === top.path), h = P.hops[top.i];
    kind = `Salto do caminho · ${h.layer}`; title = `${h.title} · ${siteName(h.site)}`;
    body = `<div class="titlerow">${pill(h.verdict)}<span>${esc(h.topReason || h.headline.label)}</span></div>${hopDetail(h)}`;
  } else if (top.type === "settings") { kind = "Configuração"; title = "Fonte de dados e tags"; body = settings(); }
  return `<div class="scrim" data-close="1"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="drawer-h">${state.drawer.length > 1 ? `<button class="iconbtn" data-back="1" aria-label="Voltar">←</button>` : ""}
        <div style="flex:1;min-width:0"><div class="kind">${esc(kind)}</div><h2>${esc(title)}</h2></div>
        <button class="iconbtn" data-close="1" aria-label="Fechar">✕</button></div>
      ${body}
    </aside>`;
}

/* ---------- render & events ---------- */
function render() {
  const list = document.querySelector(".sitelist"), listTop = list ? list.scrollTop : 0;
  const hadDrawer = !!document.querySelector(".drawer");
  document.getElementById("root").innerHTML = `
    <header class="top">
      <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--primary)"/><path d="M4 15h5l2.5-6 4 11 2.5-5H24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>NetworkPlane</div>
      <button class="srcchip ${N.demo ? "sim" : ""}" data-settings="1">${N.demo ? "Dados simulados · Exemplo Brasil" : `Dados reais · GRU ${esc(N.meta.tenant)}`}</button>
      <button class="iconbtn" data-settings="1" aria-label="Fonte de dados e tags" title="Fonte de dados e tags">⚙</button>
    </header>
    <div class="app ${state.site ? "" : "full"}">${state.site ? sidebar() : ""}<main>${state.site ? sitePage() : networkPage()}</main></div>
    ${drawer()}`;
  const nl = document.querySelector(".sitelist"); if (nl) nl.scrollTop = listTop;
  document.body.style.overflow = state.drawer.length ? "hidden" : "";
  if (state.drawer.length && !hadDrawer) document.querySelector(".drawer [data-close]")?.focus();
  const params = new URLSearchParams({src: state.src});
  if (state.site) { params.set("site", state.site); params.set("tab", state.tab); }
  history.replaceState(null, "", "#" + params.toString());
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-layer],[data-site],[data-filter],[data-tab],[data-hop],[data-dev],[data-open],[data-close],[data-back],[data-src],[data-act],[data-settings]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.go === "network") { state.site = null; state.drawer = []; }
  else if (ds.layer !== undefined) { state.layerFilter = ds.layer && state.layerFilter !== ds.layer ? ds.layer : null; }
  else if (ds.site) { state.site = ds.site; state.tab = "path"; state.drawer = []; window.scrollTo({top: 0}); }
  else if (ds.filter) { state.filter = ds.filter; }
  else if (ds.tab) { state.tab = ds.tab; }
  else if (ds.hop !== undefined) { const P = pathOf(state.site); if (P) state.drawer = [{type: "hop", path: P.id, i: +ds.hop}]; }
  else if (ds.dev) { state.drawer.push({type: "device", name: ds.dev}); state.showAllIf = false; }
  else if (ds.open === "cause") {
    const i = siteInfo(state.site);
    if (i.causeHop) state.drawer = [{type: "hop", path: i.p.id, i: i.p.summary.firstBad}];
    else if (i.causeDevice) state.drawer = [{type: "device", name: i.causeDevice.name}];
  }
  else if (ds.close) { state.drawer = []; }
  else if (ds.back) { state.drawer.pop(); }
  else if (ds.src) { useSource(ds.src); state.drawer = [{type: "settings"}]; }
  else if (ds.settings) { state.drawer = [{type: "settings"}]; }
  else if (ds.act === "onlyIssues") { state.onlyIssues = t.textContent.trim() === "Com problema"; }
  else if (ds.act === "allIf") { state.showAllIf = !state.showAllIf; }
  render();
});
document.addEventListener("input", e => {
  if (e.target.id !== "sitesearch") return;
  state.q = e.target.value;
  document.querySelector(".sitelist").innerHTML = siteListItems();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.drawer.length) { state.drawer = []; render(); return; }
  const g = e.target.closest?.("g[role=button]");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); g.dispatchEvent(new MouseEvent("click", {bubbles: true})); }
});

/* ---------- boot (deep link: #src=demo&site=SOR1&tab=path) ---------- */
(() => {
  let src = SOURCES.demo ? "demo" : "real", site = null, tab = "path";
  try {
    const q = new URLSearchParams(location.hash.slice(1));
    if (q.get("src")) src = q.get("src");
    site = q.get("site") || (q.get("path") || "").replace(/^site-/, "") || null;
    tab = q.get("tab") || "path";
  } catch (err) { /* malformed hash: use defaults */ }
  useSource(src);
  if (site && N.sites[site]) { state.site = site; state.tab = tab; }
  render();
})();
</script>
