  Fourth try, and the first that leads with an answer.

  The three before it all drew the population and left the reader to find the story: fifty rows
  that were all memory; four hundred dots; four hundred dots with tails; then quartile bars,
  legible but mute — a box plot tells you where the middle is, which is not what a capacity
  page is asked.

  The question this page exists for is "is anything going to run out". That has an answer, and
  the analyzer gives it: of four hundred and fourteen subjects, five have a forecast band that
  reaches ninety per cent of their own limit inside six and a half days. One port and four
  memories; no processor at all. So the card says that first, names them, and only then shows
  the population — because the population is context for the answer, not a substitute for it.

  The shape itself is drawn as a density rather than as marks, which is what finally made it
  readable: four hundred subjects are a smear when each gets a mark, and a legible silhouette
  when they are a curve. The bandwidth is 1.2 points, narrow enough to keep what matters — the
  memory curve is not one hump but six, and each hump is an exact tie: twenty-four switches
  report 57.4% of their memory to the decimal, sixteen report 52.7%, thirteen report 81.2%.
  Eighty-nine of the hundred and thirty-nine sit on one of six such plateaus. Those are models
  and firmwares, not eighty-nine independent facts, and no ranked list this card has had ever
  showed it — which is the thing worth knowing before anyone is dispatched to "fix" the memory
  on a switch.

  The filled curve is what was measured. The outline over it is where Dynatrace says the same
  population could be at the horizon — the two silhouettes are the whole forecast, read in one
  look: CPU does not move, memory's whole body shifts right, the port curve stays pinned at
  zero while its tail stretches to the limit.

  Nothing here is coloured by a verdict and no threshold is this app's. Ninety per cent is the
  one number the card names, and it is named as what it is: a place on the axis, chosen to list
  five subjects rather than none or forty.

  Measured on the live environment: 13 days of hourly record, horizon +156 h. Today is the 95th
  percentile of each subject's own hourly series; "could reach" is the peak of the analyzer's
  upper band — not of its point forecast, which is a de-spiked cycle and reads sixty points
  below the measured busy hour on a port that is not falling.

<style>
  :root{

  .hits{display:flex;flex-wrap:wrap;gap:7px}

  .hit:hover{border-color:var(--ink-3)}

  .hit b{color:var(--ink);font-size:12px;font-weight:400}

  svg{display:block;width:100%;overflow:visible}
  .axis{font-size:10px;font-family:var(--text);fill:var(--ink-3)}

       font-family:var(--text);padding-top:10px}

  .det-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px}

  .det-head span{font-size:11px;color:var(--ink-3);font-family:var(--text)}
  .det-x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font:inherit;font-size:16px;line-height:1}
  .det-x:hover{color:var(--ink)}
  .sorts{display:flex;gap:6px;padding:2px 0 8px;border-bottom:1px solid var(--line-2)}
  .sorts button{background:none;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;
                color:var(--ink-3);font:inherit;font-size:11px;font-family:var(--text);cursor:pointer}
  .sorts button.on{color:var(--ink);border-color:var(--ink-3)}
  .det-body{overflow:auto}
  table{width:100%;border-collapse:collapse;table-layout:fixed}

  .nm{color:var(--ink)} .sub{color:var(--ink-3)} .fc{color:var(--fc)} .none{color:var(--ink-3)}

<script>
const KINDS = [
  { id: "port", name: "Port traffic", unit: "per cent of its line rate", own: "Device", noun: "uplinks" },
  { id: "cpu",  name: "CPU",          unit: "per cent of the processor", own: "Site",   noun: "processors" },
  { id: "mem",  name: "Memory",       unit: "per cent of all it has",    own: "Site",   noun: "memories" },
];
/** the one number this card names, and it names it as a place on the axis, not as a verdict */
const NEAR = 90;
const PAD = 8, H = 58, BW = 1.2, DEAD = 0.4;
const tip = document.getElementById("tip");
let open = null, openAt = -1, sortBy = "reach";
const reach = (r) => (r[4] ?? null);
const expect = (r) => (r[3] ?? null);
const move = (r) => (reach(r) == null ? null : Math.round((reach(r) - r[2]) * 10) / 10);
const med = (a) => { const v = a.slice().sort((x, y) => x - y); return v[Math.floor(v.length / 2)]; };
const r1 = (v) => Math.round(v * 10) / 10;

/**
 * The population as a silhouette.
 *
 * A mark per subject is a smear at four hundred of them. A density is the same information as
 * a shape, and at a bandwidth of 1.2 points it still separates the memory plateaus — the
 * twenty-two switches at 81.2% and the nine at 84.8% stay two humps rather than melting into
 * one, which is the fact worth seeing.
 */
function density(values, W) {
  const N = 240, out = new Array(N).fill(0);
  for (const v of values) {
    const c = (v / 100) * (N - 1), s = (BW / 100) * (N - 1);
    const lo = Math.max(0, Math.floor(c - 4 * s)), hi = Math.min(N - 1, Math.ceil(c + 4 * s));
    for (let i = lo; i <= hi; i++) out[i] += Math.exp(-0.5 * ((i - c) / s) ** 2);
  }
  return out;
}
function area(d, peak, W, y0, h, close) {
  const N = d.length;
  const x = (i) => +(PAD + (i / (N - 1)) * (W - PAD * 2)).toFixed(1);
  const y = (v) => +(y0 - (v / peak) * h).toFixed(1);
  let p = `M${x(0)},${y(d[0])}`;
  for (let i = 1; i < N; i++) p += `L${x(i)},${y(d[i])}`;
  return close ? `${p}L${x(N - 1)},${y0}L${x(0)},${y0}Z` : p;
}

function verdict(rows) {
  const now = rows.map((r) => r[2]);
  const ahead = rows.filter((r) => reach(r) != null);
  if (!ahead.length) return "not analysed";
  const d = r1(med(ahead.map((r) => reach(r))) - med(ahead.map((r) => r[2])));
  if (Math.abs(d) < DEAD) return "the fleet stays where it is";
  return `the fleet ${d > 0 ? "moves up" : "eases"} ${Math.abs(d)} points at the median`;
}

function draw() {
  const host = document.getElementById("kinds");
  const W = host.clientWidth || 900;
  host.innerHTML = "";
  for (const k of KINDS) {
    const rows = window.ROOM[k.id];
    const ans = rows.filter((r) => reach(r) != null);
    const dNow = density(rows.map((r) => r[2]), W);
    const dAhead = density(ans.map((r) => reach(r)), W);
    const peak = Math.max(...dNow, ...dAhead);
    const near = rows.map((r, i) => ({ r, i })).filter(({ r }) => reach(r) != null && reach(r) >= NEAR);
    /**
     * Where many subjects report exactly the same number.
     *
     * Twenty-four switches at 57.4% of their memory are not twenty-four findings; they are one
     * model with one firmware, and a reader who does not know that reads the ranking as an
     * estate-wide memory problem. An exact tie at one decimal across eight or more devices is
     * not a coincidence a network produces on its own, so the count is drawn where it sits.
     *
     * Biggest first, and a label is dropped rather than written over one already placed: the
     * plateaus at 57.4 and 62.6 are five pixels apart on a nine-hundred-pixel axis.
     */
    const piles = (() => {
      const all = [...rows.reduce((m, r) => m.set(r[2], (m.get(r[2]) ?? 0) + 1), new Map())]
        .filter(([, n]) => n >= 8).sort((a, b) => b[1] - a[1]);
      const kept = [];
      for (const [v, n] of all) {
        const px = PAD + (v / 100) * (W - PAD * 2);
        if (kept.every((k) => Math.abs(k.px - px) > 46)) kept.push({ v, n, px });
      }
      return kept;
    })();
    const el = document.createElement("div");
    el.className = "kind" + (open === k.id ? " is-on" : "");
    el.innerHTML = `
      <div class="kind-head"><b>${k.name}</b><span>${k.unit} · ${rows.length} ${k.noun}</span>
        <em>${verdict(rows)}</em></div>
      <svg viewBox="0 0 ${W} ${H}" height="${H}">
        <line x1="${PAD}" x2="${W - PAD}" y1="${H - 8}" y2="${H - 8}" stroke="var(--line)" stroke-width="1"/>
        <line x1="${W - PAD}" x2="${W - PAD}" y1="2" y2="${H - 4}" stroke="var(--cap)" stroke-width="1.5"/>
        <path d="${area(dNow, peak, W, H - 8, H - 14, true)}" fill="var(--obs)" fill-opacity=".3"
          stroke="var(--obs)" stroke-width="1"/>
        <path d="${area(dAhead, peak, W, H - 8, H - 14, false)}" fill="none" stroke="var(--fc)" stroke-width="1.4"/>
        ${piles.map(({ v, n, px }) => `
          <text class="axis" x="${px.toFixed(1)}" y="10"
            text-anchor="${px < 30 ? "start" : px > W - 38 ? "end" : "middle"}">${n} alike</text>
          <line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="13" y2="${H - 9}" stroke="var(--ink-3)"
            stroke-width="1" stroke-dasharray="1 3" stroke-opacity=".45"/>`).join("")}
        ${near.map(({ r, i }) => {
          const px = +(PAD + (reach(r) / 100) * (W - PAD * 2)).toFixed(1);
          const on = open === k.id && openAt === i;
          return `<circle cx="${px}" cy="${H - 8}" r="${on ? 4 : 3.2}" fill="${on ? "var(--sel)" : "var(--bg)"}"
            stroke="${on ? "var(--bg)" : "var(--fc)"}" stroke-width="1.4" data-i="${i}" style="cursor:pointer"/>`;
        }).join("")}
      </svg>`;
    el.addEventListener("click", (e) => {
      const t = e.target.closest("[data-i]");
      show(k.id, t ? Number(t.dataset.i) : rows.indexOf(
        rows.slice().sort((a, b) => (reach(b) ?? -1) - (reach(a) ?? -1))[0]));
    });
    el.addEventListener("mousemove", (e) => {
      const t = e.target.closest("[data-i]");
      if (!t) { tip.style.opacity = 0; return; }
      const r = rows[Number(t.dataset.i)];
      tip.innerHTML = `<b>${r[0]}</b> <i>${r[1]}</i><br>${r[2]}% <i>today</i> · <u>${reach(r)}%</u> <i>could reach</i>`;
      tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 12) + "px";
      tip.style.top = (e.clientY - 48) + "px";
    });
    el.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
    host.appendChild(el);
  }
  const ax = document.getElementById("axis");
  ax.setAttribute("viewBox", `0 0 ${W} 16`);
  ax.innerHTML = [0, 25, 50, 75, 100].map((v) => {
    const px = +(PAD + (v / 100) * (W - PAD * 2)).toFixed(1);
    const anchor = v === 0 ? "start" : v === 100 ? "end" : "middle";
    return `<text class="axis" x="${px}" y="10" text-anchor="${anchor}"
      ${v === 100 ? 'fill="var(--cap)"' : ""}>${v === 100 ? "100% · its own limit" : v + "%"}</text>`;
  }).join("");
  lede();
}

function lede() {
  const all = [];
  let total = 0, answered = 0;
  for (const k of KINDS) {
    const rows = window.ROOM[k.id];
    total += rows.length;
    answered += rows.filter((r) => reach(r) != null).length;
    rows.forEach((r, i) => { if (reach(r) != null && reach(r) >= NEAR) all.push({ k, r, i }); });
  }
  all.sort((a, b) => reach(b.r) - reach(a.r));
  document.getElementById("scope").textContent =
    `${total} subjects · ${answered} answered by Dynatrace · 13 days of record · 6½ days ahead`;
  document.getElementById("lede-h").innerHTML = all.length
    ? `<b>${all.length}</b> of ${answered} could reach ${NEAR}% of their own limit by the horizon`
      + ` <span style="color:var(--ink-3)">· ${KINDS.map((k) => {
          const n = all.filter((a) => a.k.id === k.id).length;
          return `${n} ${k.name.toLowerCase()}`;
        }).join(" · ")}</span>`
    : `Nothing reaches ${NEAR}% of its own limit by the horizon`;
  document.getElementById("hits").innerHTML = all.map(({ k, r, i }) => `
    <button type="button" class="hit${open === k.id && openAt === i ? " is-on" : ""}"
      data-k="${k.id}" data-i="${i}">
      <b>${r[0]}</b><i>${r[1]}</i><s>${r[2]}%</s><i>→</i><u>${reach(r)}%</u></button>`).join("");
  document.querySelectorAll(".hit").forEach((b) =>
    b.addEventListener("click", () => show(b.dataset.k, Number(b.dataset.i))));
}

function show(kindId, index) {
  open = kindId; openAt = index;
  const k = KINDS.find((x) => x.id === kindId);
  const rows = window.ROOM[kindId];
  const subject = rows[index];
  const key = { reach: (r) => reach(r) ?? -1, now: (r) => r[2], move: (r) => move(r) ?? -99 }[sortBy];
  const order = rows.map((r, i) => ({ r, i })).sort((a, b) => key(b.r) - key(a.r) || b.r[2] - a.r[2]);
  document.getElementById("det-t").textContent = k.name;
  document.getElementById("det-u").textContent = `${k.unit} · ${rows.length} measured`;
  document.getElementById("det-own").textContent = k.own;
  document.getElementById("det-rows").innerHTML = order.map(({ r, i }) => {
    const m = move(r);
    return `<tr class="${r === subject ? "is-on" : ""}" data-i="${i}">
      <td class="nm">${r[0]}</td><td class="sub">${r[1]}</td>
      <td class="n">${r[2]}%</td>
      <td class="n ${reach(r) == null ? "none" : "fc"}">${reach(r) == null ? "not analysed" : reach(r) + "%"}</td>
      <td class="n ${expect(r) == null ? "none" : "fc"}">${expect(r) == null ? "\u2014" : expect(r) + "%"}</td>
      <td class="n ${m == null || Math.abs(m) < DEAD ? "none" : "fc"}">${m == null ? "\u2014"
        : Math.abs(m) < DEAD ? "flat" : (m > 0 ? "+" : "\u2212") + Math.abs(m)}</td></tr>`;
  }).join("");
  document.getElementById("details").classList.add("open");
  document.getElementById("det-rows").onclick = (e) => {
    const tr = e.target.closest("tr");
    if (tr) show(kindId, Number(tr.dataset.i));
  };
  requestAnimationFrame(() => {
    document.querySelector("#det-rows tr.is-on")?.scrollIntoView({ block: "center" });
    draw();
  });
}

document.querySelectorAll(".sorts button").forEach((b) => b.addEventListener("click", () => {
  sortBy = b.dataset.sort;
  document.querySelectorAll(".sorts button").forEach((x) => x.classList.toggle("on", x === b));
  if (open) show(open, openAt);
}));
document.getElementById("det-x").addEventListener("click", () => {
  open = null; openAt = -1;
  document.getElementById("details").classList.remove("open");
  draw();
});
addEventListener("resize", draw);
draw();
</script>
