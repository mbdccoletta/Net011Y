  The graphic that replaces the ranked list, and the table it drills down to.

  The list was the problem: ranked by "per cent of its own limit" across all three kinds, every
  one of its fifty rows was memory, because a switch's memory sits at 80-odd per cent while a
  port sits at two. Sorting the three together is a category error, and the reader learned
  nothing about an estate of four hundred and thirty subjects from fifty rows about one of them.

  So the card stops being a list. It is three distributions on one shared axis — every subject
  is a dot at the per cent of its own limit it reached at its busy hour, ties stacked. That is
  the whole estate in one look, and the three kinds are separated rather than mixed, so each is
  read against its own normal. The table did not go away: it is what a click opens, in the
  app's own Details region, for the kind that was clicked.

  No colour carries a verdict here. "Tight" is a judgement the app is not allowed to make, so
  the only thing that says a subject is close to its limit is where its dot sits.

  the 95th percentile of each subject's own series, one uplink per device — the heaviest, as
  `subjectsOf` picks it.
-->

<style>
  :root{
    --bg:#141419; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --ink:#fff; --ink-2:#e2e8f0; --ink-3:#9aa0b4;
    --obs:#95c0ff;      /* categorical 11 — a measured subject */
    --sel:#9f81ff;      /* categorical 08 — the one being looked at */
    --cap:#cd0c2c;      /* the ceiling, and nothing else */
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --text:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink-2);font:400 13px/1.5 var(--mono);
       display:flex;align-items:flex-start;gap:0;min-height:100vh}
  .page{flex:1;min-width:0;padding:24px}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:4px}
  .card-title{font-size:12px;letter-spacing:.02em;color:var(--obs)}
  .card-unit{font-size:12px;color:var(--ink-3);font-family:var(--text)}

  .strip{border-top:1px solid var(--line);padding:10px 0 2px;cursor:pointer}
  .strip:hover{background:rgba(255,255,255,.025)}
  .strip.is-on{box-shadow:inset 2px 0 0 var(--sel)}
  .strip-head{display:flex;align-items:baseline;gap:10px;padding:0 0 2px}
  .strip-head b{font-size:12px;color:var(--ink);letter-spacing:.02em}
  .strip-head span{font-size:11px;color:var(--ink-3);font-family:var(--text)}
  .strip-head em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink-3);
                 font-family:var(--text);font-variant-numeric:tabular-nums}
  .strip-head em b{color:var(--ink-2);font-size:11px}
  svg{display:block;width:100%}
  .axis{color:var(--ink-3);font-size:10px;font-family:var(--text)}

  .tip{position:fixed;pointer-events:none;z-index:9;background:#19192c;border:1px solid var(--line-2);
       border-radius:6px;padding:5px 8px;font-size:11px;color:var(--ink-2);white-space:nowrap;
       box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transition:opacity .08s}
  .tip b{color:var(--ink)} .tip i{font-style:normal;color:var(--ink-3)}

  /* the app's Details region, stood in for here */
  .details{width:0;flex:0 0 auto;overflow:hidden;border-left:1px solid var(--line);
           height:100vh;position:sticky;top:0;transition:width .16s ease}
  .details.open{width:460px}
  .det-in{width:460px;height:100%;display:flex;flex-direction:column;padding:18px}
  .det-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line-2);padding-bottom:8px}
  .det-head b{font-size:13px;color:var(--ink)}
  .det-head span{font-size:11px;color:var(--ink-3);font-family:var(--text)}
  .det-x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font:inherit;font-size:16px;line-height:1}
  .det-x:hover{color:var(--ink)}
  .det-body{overflow:auto;margin-top:2px}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{position:sticky;top:0;background:var(--bg);font-weight:400;font-size:11px;color:var(--ink-3);
     text-align:left;padding:6px 8px 5px 0;font-family:var(--text);border-bottom:1px solid var(--line)}
  th.n,td.n{text-align:right}
  td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  tr:hover td{background:rgba(255,255,255,.035);cursor:default}
  tr.is-on td{background:rgba(255,255,255,.06);box-shadow:inset 2px 0 0 var(--sel)}
  .nm{color:var(--ink)} .sub{color:var(--ink-3)}
  .note{color:var(--ink-3);font-size:11.5px;font-family:var(--text);margin-top:10px}
</style>

<div class="page">
  <div class="card">
    <div class="card-head">
      <span class="card-title">How much room each has left</span>
      <span class="card-unit">every subject against its own limit, at its busy hour · 13 days of record</span>
    </div>
    <div id="strips"></div>
    <svg id="axis" height="20" aria-hidden="true"></svg>
    <div class="note">One dot is one subject; equal readings stack. Pick a dot, or a row, for the table.</div>
  </div>
</div>

<div class="details" id="details"><div class="det-in">
  <div class="det-head"><b id="det-t"></b><span id="det-u"></span>
    <button type="button" class="det-x" id="det-x" title="Close">×</button></div>
  <div class="det-body"><table>
    <colgroup><col><col style="width:21%"><col style="width:76px"><col style="width:74px"></colgroup>
    <thead><tr><th>Subject</th><th id="det-own">Site</th><th class="n">Busy hour</th><th class="n">Room left</th></tr></thead>
    <tbody id="det-rows"></tbody>
  </table></div>
</div></div>

<div class="tip" id="tip"></div>

<script>
const KINDS = [
  { id: "port", name: "Port traffic", unit: "per cent of its line rate", own: "Device", noun: "uplinks" },
  { id: "cpu",  name: "CPU",          unit: "per cent of the processor", own: "Site",   noun: "processors" },
  { id: "mem",  name: "Memory",       unit: "per cent of all it has",    own: "Site",   noun: "memories" },
];
const PAD = 8, R_MAX = 2.5, PITCH_MAX = 5.6, H_ROW = 84;
const tip = document.getElementById("tip");
let open = null, openAt = -1;

/**
 * One subject per dot, ties stacked symmetrically — a shape nobody had to choose a bin for.
 *
 * Every row is the same height, and the pile fits inside it: twenty-eight uplinks sit within
 * a tenth of a per cent of each other and twenty-two switches report exactly 81.2% of their
 * memory. Letting a row grow to its tallest pile made the ports band a hundred and ninety
 * pixels of mostly nothing; clipping the pile looked like a drawing error. So the spacing
 * closes instead, and a dense column reads as the thick bar it is.
 */
function swarm(rows, W) {
  const x = (v) => PAD + (v / 100) * (W - PAD * 2);
  const lanes = new Map();           // pixel column -> how many already placed there
  const placed = rows.map((r, i) => {
    const px = x(r[2]);
    const col = Math.round(px / (R_MAX * 2 + 0.6));
    const n = lanes.get(col) ?? 0;
    lanes.set(col, n + 1);
    /* 0, -1, +1, -2, +2 … so a pile grows evenly about the line rather than off one edge */
    const step = Math.ceil(n / 2) * (n % 2 ? -1 : 1);
    return { i, r, cx: px, step };
  });
  const tallest = Math.max(...placed.map((p) => Math.abs(p.step)), 1);
  const pitch = Math.min(PITCH_MAX, (H_ROW - 12) / (tallest * 2));
  const r = Math.min(R_MAX, Math.max(1.4, pitch * 0.62));
  return { h: H_ROW, r, pts: placed.map((p) => ({ ...p, cy: H_ROW / 2 + p.step * pitch })) };
}

function draw() {
  const host = document.getElementById("strips");
  const W = host.clientWidth || 900;
  host.innerHTML = "";
  for (const k of KINDS) {
    const rows = window.ROOM[k.id];
    const { h, r, pts } = swarm(rows, W);
    const el = document.createElement("div");
    el.className = "strip" + (open === k.id ? " is-on" : "");
    el.dataset.kind = k.id;
    el.innerHTML = `
      <div class="strip-head"><b>${k.name}</b><span>${k.unit}</span>
        <em>${rows.length} ${k.noun} · tightest <b>${rows[0][2]}%</b></em></div>
      <svg viewBox="0 0 ${W} ${h}" height="${h}">
        <line x1="${PAD}" x2="${W - PAD}" y1="${h / 2}" y2="${h / 2}" stroke="var(--line)" stroke-width="1"/>
        <line x1="${W - PAD}" x2="${W - PAD}" y1="4" y2="${h - 4}" stroke="var(--cap)" stroke-width="1.5"/>
        ${pts.map((p) => {
          const on = open === k.id && openAt === p.i;
          return `<circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="${(on ? Math.max(r, 3.4) : r).toFixed(1)}"
            fill="${on ? "var(--sel)" : "var(--obs)"}" fill-opacity="${on ? 1 : .8}"
            ${on ? 'stroke="var(--bg)" stroke-width="1.5"' : ""} data-i="${p.i}"/>`;
        }).join("")}
      </svg>`;
    el.addEventListener("click", (e) => {
      const c = e.target.closest("circle");
      show(k.id, c ? Number(c.dataset.i) : 0);
    });
    el.addEventListener("mousemove", (e) => {
      const c = e.target.closest("circle");
      if (!c) { tip.style.opacity = 0; return; }
      const r = rows[Number(c.dataset.i)];
      tip.innerHTML = `<b>${r[0]}</b> <i>${r[1]}</i> · ${r[2]}% <i>of ${k.unit.replace("per cent of ", "")}</i>`;
      tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 12) + "px";
      tip.style.top = (e.clientY - 34) + "px";
    });
    el.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
    host.appendChild(el);
  }
  const ax = document.getElementById("axis");
  ax.setAttribute("viewBox", `0 0 ${W} 20`);
  ax.innerHTML = [0, 25, 50, 75, 100].map((v) => {
    const px = PAD + (v / 100) * (W - PAD * 2);
    const anchor = v === 0 ? "start" : v === 100 ? "end" : "middle";
    return `<text class="axis" x="${px}" y="12" text-anchor="${anchor}"
      fill="${v === 100 ? "var(--cap)" : "currentColor"}">${v === 100 ? "100% · its limit" : v + "%"}</text>`;
  }).join("");
}

function show(kindId, index) {
  open = kindId; openAt = index;
  const k = KINDS.find((x) => x.id === kindId);
  const rows = window.ROOM[kindId];
  document.getElementById("det-t").textContent = k.name;
  document.getElementById("det-u").textContent = `${k.unit} · ${rows.length} measured, tightest first`;
  document.getElementById("det-own").textContent = k.own;
  document.getElementById("det-rows").innerHTML = rows.map((r, i) => `
    <tr class="${i === index ? "is-on" : ""}" data-i="${i}">
      <td class="nm">${r[0]}</td><td class="sub">${r[1]}</td>
      <td class="n">${r[2]}%</td><td class="n">${Math.round((100 - r[2]) * 10) / 10} pts</td>
    </tr>`).join("");
  document.getElementById("details").classList.add("open");
  document.getElementById("det-rows").onclick = (e) => {
    const tr = e.target.closest("tr");
    if (tr) show(kindId, Number(tr.dataset.i));
  };
  requestAnimationFrame(() => {
    document.querySelector("#det-rows tr.is-on")?.scrollIntoView({ block: "center" });
    draw();
  });
}
