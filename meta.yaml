setup_instructions: >
  1. Clone this folder and run `npm install` in `app/`.
  2. Set `environmentUrl` in `app/app.config.json` to your tenant - it ships
     with a placeholder on purpose, so the repository names no environment.
  3. Raise `version` in `app/app.config.json` before each deploy: the platform
     refuses a version it already holds.
  4. Build and deploy:
     `cd app && npm run build && npx dt-app deploy --skip-build --environment-url https://<your-tenant>.apps.dynatrace.com`
     Repeat the deploy line once per environment.
  5. Open "NetO11y" from the app launcher. With no network data yet, Settings >
     General > Data source opens two simulated networks (about 550 sites, and
     the same group at 4,200 sites and 20,000 devices) so the app can be
     explored before anything is sent.
  Nothing else has to be configured: the app reads what the environment already
  stores. Primary tags on the SNMP monitoring configurations (site, geo) and on
  the ICMP monitors (circuit id, carrier, SLA) enrich the map and the WAN page
  where they exist, and the app says which step adds what where they do not.
  Required scopes, all declared in app.config.json: storage:smartscape:read,
  storage:metrics:read, storage:logs:read, storage:events:read,
  storage:user.sessions:read, storage:buckets:read, storage:system:read,
  storage settings:objects:read, state:app-states:read/write,
  davis:analyzers:read/execute and davis-copilot:conversations:execute.
