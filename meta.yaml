title: "NetO11y"
description: >
  Shows a monitored network the way an operator reads it: sites on a map,
  devices by role, WAN reachability and circuits, traffic between sites, and
  the open problems that explain what is wrong - with drill-downs into the
  native apps for the detail.
purpose: >
  A network already monitored by the Dynatrace SNMP extensions is spread across
  Smartscape, metrics, syslog, SNMP traps and synthetic monitors, and nobody on
  shift assembles those five into "which sites are down, and why" in the middle
  of an incident. This app does that assembly: it opens on the sites that are
  offline and the fault they share - a carrier, a data centre, a circuit - so a
  reader starts at the cause instead of a device list. It judges nothing itself
  and holds no thresholds of its own: a site, device, link or interface is red
  or yellow only because Dynatrace Intelligence has an open problem or alert on
  it, and everything else is shown as a measurement. It needs no tagging to be
  useful - any SNMP-monitored estate is enough - and says which optional source
  (primary tags, circuit tags, NetFlow, OneAgent flows) would add what.
